[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "icd-transfer"
version = "0.1.0"
description = "Laya-IsoToken: Zero-Training Clinical Codebook Switching via Closed-Form Operator Compilation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Zeqiang Wang", email = "zeqiang.wang@surrey.ac.uk" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "transformers==5.0.0",
  "huggingface-hub>=1.3,<2",
  "safetensors>=0.5,<0.8",
  "numpy>=2,<3",
  "pyarrow>=19,<24",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
]

[project.scripts]
icd-transfer = "icd_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

